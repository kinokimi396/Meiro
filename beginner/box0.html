<!DOCTYPE html>
<html>
    <head>
        <style>

            .container{
                display:flex;
                align-items:center;
                gap:20px;
            }
            .rectangle {
                width: 200px;
                height: 50px;
                border: 2px solid black;
                background-color: red;
                position:relative;
            }
            .daikei{
                width:100px;
                height:0px;
                border-bottom:100px solid blue;
                border-left:50px solid transparent;
                border-right:50px solid transparent;

            }
        </style>
    </head>
    <body>

        <div class="container">
            <div class="rectangle"></div>
            <div class="daikei"></div>
        </div>
    </body>
</html>
